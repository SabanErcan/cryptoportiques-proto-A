<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype A — Déformation deux murs</title>
    <!-- Favicon vide pour éviter l'erreur 404 favicon.ico dans la console -->
    <link rel="icon" href="data:,">
    <style>
        /* Fond noir, plein écran, pas de défilement */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Le canvas Three.js occupe tout l'écran */
        #canvas-principal {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Panneau d'aide affiché en haut */
        #aide {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Message de sauvegarde (apparaît brièvement) */
        #message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 180, 80, 0.85);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            padding: 6px 18px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.4s;
        }
        #message.visible { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="canvas-principal"></canvas>

    <div id="aide">
        <strong>C</strong> : afficher/cacher les coins &nbsp;|&nbsp;
        <strong>G</strong> : grille de test / source &nbsp;|&nbsp;
        <strong>F</strong> : plein écran &nbsp;|&nbsp;
        <strong>S</strong> : sauvegarder &nbsp;|&nbsp;
        Déplacer un coin : <strong>clic + glisser</strong>
    </div>

    <div id="message">Réglages sauvegardés ✓</div>

    <!--
        Three.js : bibliothèque 3D pour le navigateur.
        On utilise la version CDN (chargée depuis Internet la première fois,
        puis mise en cache par le navigateur).
        r128 est la dernière version compatible avec les modules classiques (non ESM).
    -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- Notre module de calcul d'homographie -->
    <script src="homographie.js"></script>

    <!-- Le code principal de l'application -->
    <script src="app.js"></script>
</body>
</html>
